name: APK yig'ish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketlarni o'rnatish
        run: npm install

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' $M
          grep -n "screenOrientation" $M
          npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ni nomlash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KarraJadval.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KarraJadval-apk
          path: KarraJadval.apk

      - name: Releases bo'limiga joylash (telefondan yuklab olish uchun)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" KarraJadval.apk \
            --title "Karra Jadval v${{ github.run_number }}" \
            --notes "Telefoningizga o'rnatish uchun KarraJadval.apk ni yuklab oling."
