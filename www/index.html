<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7ad7f0">
<title>Karra Jadval</title>
<style>
:root{
  --ink:#2d3561;
  --sky1:#8be0f5;--sky2:#c9f2ff;
  --green1:#5fd68a;--green2:#2fb468;--green3:#1f8f50;
  --blue1:#5aa9ff;--blue2:#2f7fe6;--blue3:#1d5fb8;
  --orange1:#ffb347;--orange2:#ff8c1a;--orange3:#cc6a00;
  --purple1:#b68cff;--purple2:#8a5cf0;--purple3:#6540c0;
  --pink1:#ff8fc7;--pink2:#ff5fae;--pink3:#cc3d86;
  --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
  font-weight:800;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,#fff6d6 100%);
}
/* floating decorations */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:34px;opacity:.55;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
.screen{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto}
.screen.on{display:flex;animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;flex:none}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:6px 14px 6px 8px;
  box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:18px;max-width:70%;cursor:pointer;border:0;color:var(--ink);font-family:inherit;font-weight:800}
.chip .av{font-size:28px;line-height:1}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.round{width:50px;height:50px;border-radius:50%;border:0;background:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
h1{margin:0;text-align:center;line-height:1.05}
.title{font-size:36px;color:#fff;text-shadow:0 4px 0 #2d3561,0 0 14px rgba(45,53,97,.45);-webkit-text-stroke:2px #2d3561;paint-order:stroke fill}
.sub{text-align:center;font-size:17px;opacity:.8;margin:2px 0 0}
.bigbtn{
  --c1:var(--blue1);--c2:var(--blue2);--c3:var(--blue3);
  border:0;border-radius:28px;color:#fff;font-family:inherit;font-weight:800;cursor:pointer;
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 8px 0 var(--c3),0 12px 18px rgba(0,0,0,.18);
  text-shadow:0 2px 0 rgba(0,0,0,.2);
  transition:transform .08s,box-shadow .08s;
}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--c3),0 4px 8px rgba(0,0,0,.18)}
.green{--c1:var(--green1);--c2:var(--green2);--c3:var(--green3)}
.blue{--c1:var(--blue1);--c2:var(--blue2);--c3:var(--blue3)}
.orange{--c1:var(--orange1);--c2:var(--orange2);--c3:var(--orange3)}
.purple{--c1:var(--purple1);--c2:var(--purple2);--c3:var(--purple3)}
.pink{--c1:var(--pink1);--c2:var(--pink2);--c3:var(--pink3)}
.red{--c1:#ff8a8a;--c2:#f25555;--c3:#b83030}
.teal{--c1:#4fd8c4;--c2:#1fb5a0;--c3:#118a79}

/* HOME */
#s-home{justify-content:flex-start}
.homeWrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-bottom:6px}
.mascot{font-size:64px;text-align:center;animation:wig 2.4s ease-in-out infinite;line-height:1}
@keyframes wig{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.1)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:4px 2px}
.menu .bigbtn{aspect-ratio:1/1.02;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;padding:6px}
.menu .bigbtn .ic{font-size:58px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.boardBtn{padding:14px;font-size:22px;margin:0 2px 8px}

/* generic */
.head{display:flex;align-items:center;gap:10px;flex:none}
.head h2{margin:0;flex:1;text-align:center;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(45,53,97,.35)}
.head .sp{width:50px}
.note{text-align:center;font-size:16px;margin:8px 4px;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin:10px 4px;flex:1;align-content:start}
.grid2 .bigbtn{font-size:30px;padding:16px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px}
.grid2 .bigbtn small{font-size:14px;opacity:.95;font-weight:700;text-shadow:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:26px;padding:5px;margin:12px 2px 6px;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:none}
.seg button{border:0;border-radius:22px;padding:12px 0;font-family:inherit;font-weight:800;font-size:20px;background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--blue1),var(--blue2));color:#fff;box-shadow:0 3px 0 var(--blue3)}
.times{display:flex;gap:8px;justify-content:center;margin:6px 0;flex:none}
.times button{border:0;border-radius:18px;padding:10px 14px;font-family:inherit;font-weight:800;font-size:17px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.times button.on{background:linear-gradient(180deg,var(--orange1),var(--orange2));color:#fff;box-shadow:0 3px 0 var(--orange3)}

/* LEARN */
.card{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.1);margin:10px 2px;flex:none}
.pads{display:flex;gap:10px;overflow-x:auto;padding:30px 6px 8px;scroll-behavior:smooth;scrollbar-width:none}
.pads::-webkit-scrollbar{display:none}
.pad{flex:none;width:62px;height:42px;border-radius:50%;background:#7be08f;border:3px solid #3fb85f;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#14562a;position:relative;box-shadow:0 4px 0 #2e9a4c}
.pad.on{background:#ffe066;border-color:#f0b400;box-shadow:0 4px 0 #c79400;transform:scale(1.12)}
.pad .fr{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:34px;animation:hop .5s ease-out}
@keyframes hop{0%{transform:translate(-50%,0)}40%{transform:translate(-50%,-26px) scale(1.15)}100%{transform:translate(-50%,0)}}
.eq{text-align:center;font-size:40px;margin:2px 0}
.eq b{color:var(--green3)}
.chain{text-align:center;font-size:18px;min-height:26px;opacity:.85;word-break:break-word}
.groups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;min-height:30px}
.grp{display:flex;flex-wrap:wrap;gap:3px;width:50px;padding:4px;border-radius:12px;justify-content:center;animation:pop .25s ease-out}
.grp i{width:11px;height:11px;border-radius:50%;display:block}
.rows{display:grid;gap:8px;margin:6px 2px}
.row{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.1);cursor:pointer;border:3px solid transparent}
.row.on{border-color:#ffc400;background:#fff9d6;transform:scale(1.03)}
.row .ans{min-width:70px;text-align:left;color:var(--green3)}
.hide .row .ans{filter:blur(9px)}
.hide .row.rev .ans{filter:none}
.rowBtns{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 2px 6px}
.rowBtns .bigbtn{padding:14px;font-size:22px}

/* GAME */
.gbar{flex:none;display:flex;align-items:center;gap:10px}
.prog{flex:1;height:22px;background:rgba(255,255,255,.75);border-radius:14px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd68a,#2fb468);border-radius:14px;transition:width .25s linear}
.prog.time i{background:linear-gradient(90deg,#ffb347,#ff8c1a)}
.prog.low i{background:linear-gradient(90deg,#ff8a8a,#f25555)}
.score{background:#fff;border-radius:22px;padding:8px 14px;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.qinfo{text-align:center;font-size:19px;margin:10px 0 0;opacity:.85}
.qbox{background:#fff;border-radius:34px;margin:10px 4px 14px;padding:22px 10px;text-align:center;font-size:64px;box-shadow:0 8px 0 rgba(0,0,0,.1);flex:none}
.qbox small{display:block;font-size:20px;opacity:.7}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin:4px 4px;flex:1;align-content:start}
.answers .bigbtn{font-size:44px;padding:22px 4px}
.answers .bigbtn.ok{--c1:#6ff09c;--c2:#18b560;--c3:#0e7a40;animation:jump .5s}
.answers .bigbtn.bad{--c1:#ff9a9a;--c2:#ef4444;--c3:#a52222;animation:shake .4s}
.answers .bigbtn.dim{opacity:.55}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-16px) scale(1.06)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.cheer{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:90px;pointer-events:none;z-index:50;animation:cheer .8s ease-out forwards}
@keyframes cheer{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(1)}}

/* RESULT */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.stars{font-size:62px;letter-spacing:4px}
.res h2{margin:0;font-size:34px}
.res .big{font-size:56px;color:var(--green3)}
.res p{margin:0;font-size:20px}
.res .bigbtn{width:84%;padding:16px;font-size:24px}
.fall{position:fixed;top:-50px;font-size:30px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ANALYSIS & BOARD */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 2px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 2px}.stat4 .stat b{font-size:26px}
.stat{background:#fff;border-radius:20px;padding:10px 4px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.stat b{display:block;font-size:30px;color:var(--blue2)}
.stat span{font-size:13px;opacity:.8}
.sec{background:#fff;border-radius:24px;padding:14px;margin:10px 2px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.sec h3{margin:0 0 8px;font-size:21px}
.sec ul{margin:0;padding-left:20px;font-size:17px;line-height:1.45;font-weight:700}
.sec.good{background:#e9fff0}.sec.bad{background:#fff0ee}.sec.tip{background:#fff9d6}
.tb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:17px}
.tb .l{width:46px}
.tb .bar{flex:1;height:16px;border-radius:10px;background:#e8ecf7;overflow:hidden}
.tb .bar i{display:block;height:100%;border-radius:10px}
.tb .p{width:62px;text-align:right;font-size:14px}
.hist{font-size:15px;font-weight:700;display:grid;gap:5px}
.hist div{display:flex;justify-content:space-between;gap:6px;background:#f3f6ff;border-radius:12px;padding:6px 10px}
.lb{display:grid;gap:10px;margin:10px 2px}
.lbrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.lbrow.me{outline:4px solid #ffc400}
.lbrow .rk{font-size:30px;width:44px;text-align:center}
.lbrow .av{font-size:36px}
.lbrow .nm{flex:1;font-size:20px;line-height:1.1;overflow:hidden}
.lbrow .nm small{display:block;font-size:13px;opacity:.7;font-weight:700}
.lbrow .pt{font-size:24px;color:var(--orange3)}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(45,53,97,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
.box{background:#fff;border-radius:30px;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.box h3{margin:0 0 10px;font-size:26px;text-align:center}
.box label{display:block;font-size:17px;margin:12px 0 4px}
.box input{width:100%;font-family:inherit;font-weight:800;font-size:24px;padding:12px 14px;border:3px solid #cfd8ff;border-radius:18px;color:var(--ink);user-select:text;-webkit-user-select:text;outline:0}
.box input:focus{border-color:var(--blue2)}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avs button{font-size:34px;border:3px solid transparent;border-radius:16px;background:#f1f4ff;padding:6px 0;cursor:pointer}
.avs button.on{border-color:var(--orange2);background:#fff4df;transform:scale(1.06)}
.ages{display:flex;gap:6px;flex-wrap:wrap}
.ages button{flex:1;min-width:44px;font-family:inherit;font-weight:800;font-size:20px;border:3px solid transparent;border-radius:14px;background:#f1f4ff;padding:8px 0;color:var(--ink);cursor:pointer}
.ages button.on{border-color:var(--orange2);background:#fff4df}
.box .bigbtn{width:100%;padding:14px;font-size:24px;margin-top:16px}
.err{color:#d33;font-size:15px;min-height:20px;text-align:center;margin-top:6px}
.plist{display:grid;gap:8px;margin-bottom:6px}
.plist button{display:flex;align-items:center;gap:10px;font-family:inherit;font-weight:800;font-size:20px;border:3px solid #e1e7ff;background:#f6f8ff;border-radius:18px;padding:8px 12px;color:var(--ink);cursor:pointer;text-align:left}
.plist button.on{border-color:var(--green2);background:#eafff2}
.plist .av{font-size:30px}
/* v2 */
.topR{display:flex;gap:10px}
.chip{max-width:56%}
.actTitle{text-align:center;font-size:23px;margin:2px 0 4px}
.actTip{text-align:center;font-size:16px;opacity:.85;margin:0 4px 8px;line-height:1.25}
#act{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mach{width:100%;text-align:center}
.mrow{font-size:26px;line-height:1.25;word-break:break-all;min-height:34px;padding:4px 8px;background:#fff6f0;border-radius:16px}
.marrow{font-size:19px;margin:4px 0;color:var(--orange3)}
.stairs{display:flex;align-items:flex-end;gap:3px;height:196px;padding-top:34px;width:100%}
.stp{flex:1;border-radius:8px 8px 0 0;background:#d9e2ff;position:relative;display:flex;justify-content:center;align-items:flex-start;font-size:13px;padding-top:4px;cursor:pointer}
.stp.on{background:linear-gradient(#ffd36b,#ff9f43)}
.stp em{position:absolute;top:-32px;font-style:normal;font-size:28px}
.choc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:240px}
.choc i{font-style:normal;background:#7a4a2e;color:#ffe9d0;border-radius:6px;font-size:12px;text-align:center;line-height:25px}
.choc i.new{background:#d49a62;color:#4a2a14;animation:pop .3s}
.clock{width:230px;height:230px}
.grp.six{width:64px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:16px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:13px;text-align:center;width:100%}
.cal b{font-size:12px;color:#6b74a0}
.cal i{font-style:normal;background:#eaf0ff;border-radius:6px;line-height:24px}
.cal i.we{background:#ffe3e3}
.cal i.new{background:#ffd36b;animation:pop .3s}
.chain8{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.chain8 span{font-size:18px;color:var(--orange3)}
.bub{min-width:50px;height:50px;border-radius:50%;background:#e6efff;display:flex;align-items:center;justify-content:center;font-size:20px;padding:0 6px;border:3px solid #5aa9ff}
.bub.big{background:#ffe9a8;border-color:#ffb347;font-size:24px}
.fing{display:flex;align-items:flex-end;gap:5px;height:130px}
.fg{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;cursor:pointer;font-family:inherit;color:var(--ink)}
.fg:nth-child(5){margin-right:14px}
.fg i{display:block;width:22px;height:84px;border-radius:12px;background:#cfd6ee}
.fg.L i{background:#5aa9ff}.fg.R i{background:#4fd18a}
.fg.fold i{height:30px;background:#ffb347}
.fg b{font-size:14px}
.rowBtns{margin:8px 2px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(45,53,97,.92);color:#fff;padding:12px 18px;border-radius:22px;font-size:17px;z-index:300;max-width:88%;text-align:center;animation:pop .25s}

.stages{display:grid;gap:14px;margin:12px 2px}
.stage{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;font-size:20px}
.stage .ic{font-size:38px}
.stage .tx{flex:1;line-height:1.1}
.stage .tx small{display:block;font-size:13px;font-weight:700;text-shadow:none;opacity:.95;margin-top:3px}
.stage .st{font-size:22px;white-space:nowrap}
.stage.locked{--c1:#c9cfe4;--c2:#aab2d0;--c3:#8790b0;opacity:.85}
.ansBox{background:#fff;border-radius:24px;margin:2px 4px 10px;padding:6px;text-align:center;font-size:52px;min-height:76px;box-shadow:0 6px 0 rgba(0,0,0,.1);color:var(--blue2)}
.ansBox.ok{background:#d8ffe6;color:var(--green3)}
.ansBox.bad{background:#ffe1e1;color:#c0392b}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 10px;margin:0 6px;flex:none}
.numpad .bigbtn{font-size:32px;padding:10px 0;border-radius:22px;box-shadow:0 6px 0 var(--c3)}
.prog.thin{height:12px;margin:8px 6px 0;flex:none}

#lock{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(180deg,#2d3561,#6a5acd 70%,#9db4ff);color:#fff}
#lock.on{display:flex}
#lkIcon{font-size:90px;animation:wig 3s ease-in-out infinite}
#lkTitle{font-size:30px;line-height:1.1}
#lkTime{font-size:72px;letter-spacing:2px}
#lkTip{font-size:22px;max-width:340px;line-height:1.25;opacity:.95}
#lkBtn{width:86%;padding:16px;font-size:26px;display:none}
.trackBtn{display:none;border:0;border-radius:18px;background:rgba(255,255,255,.75);color:var(--ink);font-family:inherit;font-weight:800;font-size:15px;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <span style="left:6%;top:12%">⭐</span><span style="left:84%;top:8%;animation-delay:-2s">☁️</span>
  <span style="left:70%;top:34%;animation-delay:-4s">✨</span><span style="left:4%;top:52%;animation-delay:-1s">🎈</span>
  <span style="left:88%;top:62%;animation-delay:-5s">⭐</span><span style="left:12%;top:84%;animation-delay:-3s">🌈</span>
  <span style="left:78%;top:88%;animation-delay:-6s">🎈</span>
</div>

<!-- HOME -->
<section id="s-home" class="screen on" data-music="1">
  <div class="top">
    <button class="chip" id="profChip"><span class="av">🙂</span><span class="nm">Profil</span></button>
    <div class="topR"><button class="round" data-go="analysis" aria-label="Tahlil">📊</button><button class="round" id="muteBtn" aria-label="Ovoz">🔊</button></div>
  </div>
  <div class="homeWrap">
    <div>
      <div class="mascot">🦉</div>
      <h1 class="title">Karra Jadval<br>Sarguzashti</h1>
    </div>
    <div class="menu">
      <button class="bigbtn green" data-go="learnsel"><span class="ic">📚</span>O'rganamiz</button>
      <button class="bigbtn blue" data-go="practice"><span class="ic">✏️</span>Mashq qilamiz</button>
      <button class="bigbtn orange" data-go="contest"><span class="ic">🏆</span>Musobaqa</button>

var Snd={ctx:null,fx:null,mbus:null,timer:null,step:0,nextT:0,on:false,trk:0,loops:0,last:-1,
  init:function(){

  sched:function(){

    for(i=1;i<=7*k;i++){var col=(i-1)%7;s+='<i class="'+(col>=5?'we':'')+(i>7*(k-1)?' new':'')+'">'+i+'</i>'}
    return s+'</div>';
  case 8:
    return '<div class="chain8"><div class="bub">'+k+'</div><span>×2</span><div class="bub">'+(2*k)+'</div><span>×2</span><div class="bub">'+(4*k)+'</div><span>×2</span><div class="bub big">'+(8*k)+'</div></div>';
  case 9:
    s='<div class="fing">';
    for(i=1;i<=10;i++)s+='<button class="fg'+(i===k?' fold':(i<k?' L':' R'))+'" data-k="'+i+'"><i></i><b>'+i+'</b></button>';
    return s+'</div><div class="legend"><span style="color:#2f7fe6">◀ '+(k-1)+' ta — o\'nliklar</span> <span style="color:#1f8f50">'+(10-k)+' ta — birliklar ▶</span></div>';
  }
  return '';
}
function chainText(n,k){
  switch(n){
  case 2:return k+' + '+k+' = '+(2*k)+' (ikkilantirdik)';
  case 3:var a=[];for(var i=1;i<=k;i++)a.push(3*i);return a.join(', ');
  case 4:return k+' qator × 4 bo\'lak = '+(4*k)+' bo\'lak';
  case 5:return '⏰ '+(5*k)+' daqiqa';
  case 6:return '6 × '+k+' = 5 × '+k+' + '+k+' = '+(5*k)+' + '+k+' = '+(6*k);
  case 7:return k+' hafta × 7 kun = '+(7*k)+' kun';
  case 8:return k+' → '+(2*k)+' → '+(4*k)+' → '+(8*k)+' (3 marta ikkilantirdik)';
  case 9:return (k-1)+' va '+(10-k)+' → '+(9*k)+'  (raqamlar yig\'indisi: '+(Math.floor(9*k/10)+(9*k)%10)+')';
  }
  return '';
}

/* ---------- game ---------- */
function endTimers(){if(typeof CG!=='undefined'&&CG){if(CG.timer){clearInterval(CG.timer);CG.timer=null}if(CG.nt){clearTimeout(CG.nt);CG.nt=null}}if(G&&G.timer){clearInterval(G.timer);G.timer=null}if(G&&G.nt){clearTimeout(G.nt);G.nt=null}}
function startGame(cfg){
  endTimers();resFrom='';
  G={mode:cfg.mode,scope:cfg.scope,n:cfg.n,total:cfg.total||10,secs:cfg.secs||60,
     q:0,correct:0,wrong:0,streak:0,best:0,locked:false,over:false,last:null,used:{},
     t0:Date.now(),timer:null,nt:null,order:null,cur:null};
  if(G.mode==='learn'){var o=[];for(var i=1;i<=10;i++)o.push(i);G.order=shuffle(o)}
  var contest=G.mode==='contest';
  $('#gProg').classList.toggle('time',contest);$('#gProg').classList.remove('low');
  $('#gProg i').style.width=contest?'100%':'0%';
  go('game');
  if(contest){
    G.end=Date.now()+G.secs*1000;
    G.timer=setInterval(tick,200);
  }
  nextQ();
}
function tick(){
  if(!G||G.over)return;
  var left=Math.max(0,G.end-Date.now());
  $('#gProg i').style.width=(left/(G.secs*1000)*100)+'%';
  $('#gProg').classList.toggle('low',left<10000);
  $('#qInfo').textContent='⏱ '+Math.ceil(left/1000)+' soniya qoldi';
  if(left<=0)finish();
}
function weightFor(p,a,b){
  var k=Math.min(a,b)+'x'+Math.max(a,b),f=p.facts[k];
  return 1+(f?Math.min(f.w,4)*2:0);
}
function pickQ(){
  var p=cur(),a,b;
  if(G.mode==='learn'){a=G.n;b=G.order[G.q];return {a:a,b:b,t:a}}
  var tables=[];
  if(G.scope==='single')tables=[G.n];else for(var n=2;n<=G.n;n++)tables.push(n);
  var pool=[];
  tables.forEach(function(t){for(var m=2;m<=10;m++){
    var key=t+'x'+m;
    if(G.mode==='practice'&&G.used[key])continue;
    if(G.last===key)continue;
    var w=weightFor(p,t,m);for(var i=0;i<w;i++)pool.push([t,m]);
  }});
  if(!pool.length){tables.forEach(function(t){for(var m=2;m<=10;m++)pool.push([t,m])})}
  var c=pool[rnd(pool.length)];
  return {a:c[0],b:c[1],t:c[0]};
}
function choices(a,b){
  var ans=a*b,set={},arr=[ans];set[ans]=1;
  var cand=[ans+a,ans-a,ans+b,ans-b,ans+10,ans-10,a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+2,ans-2];
  shuffle(cand);
  for(var i=0;i<cand.length&&arr.length<4;i++){var v=cand[i];if(v>0&&!set[v]){set[v]=1;arr.push(v)}}
  while(arr.length<4){var v2=ans+rnd(21)-10;if(v2>0&&!set[v2]){set[v2]=1;arr.push(v2)}}
  return shuffle(arr);
}
function updateScore(){
  $('#gScore').textContent='⭐ '+(G.mode==='contest'?G.correct*10:G.correct);
}
function nextQ(){
  if(!G||G.over)return;
  if(G.mode!=='contest'&&G.q>=G.total){finish();return}
  var q=pickQ(),flip=(G.mode!=='learn')&&rnd(2)===1;
  G.cur=q;G.last=q.a+'x'+q.b;G.used[G.last]=1;G.locked=false;
  var x=flip?q.b:q.a,y=flip?q.a:q.b;
  $('#qBox').innerHTML=x+' × '+y+' = ?';
  if(G.mode==='contest'){/* qInfo shows time */}
  else{$('#qInfo').textContent='Savol '+(G.q+1)+' / '+G.total;$('#gProg i').style.width=(G.q/G.total*100)+'%'}
  updateScore();
  var ch=choices(q.a,q.b),h='';
  ch.forEach(function(v,i){h+='<button class="bigbtn '+['blue','orange','purple','teal'][i]+'" data-v="'+v+'">'+v+'</button>'});
  $('#answers').innerHTML=h;
  $$('#answers button').forEach(function(b){b.onclick=function(){answer(b,+b.getAttribute('data-v'))}});
}
function cheer(e){
  var d=document.createElement('div');d.className='cheer';d.textContent=e;document.body.appendChild(d);
  setTimeout(function(){d.remove()},850);
}
var GOOD=['🌟','🎉','👏','😄','🦄','🚀'],BAD=['🤔','💪','🙂'];
function answer(btn,v){
  if(!G||G.locked||G.over)return;
  G.locked=true;
  var q=G.cur,ok=(v===q.a*q.b),p=cur();
  var key=Math.min(q.a,q.b)+'x'+Math.max(q.a,q.b);
  var f=p.facts[key]||(p.facts[key]={c:0,w:0});
  var t=p.tables[q.t]||(p.tables[q.t]={c:0,w:0});
  G.q++;
  if(ok){f.c++;t.c++;G.correct++;G.streak++;if(G.streak>G.best)G.best=G.streak;if(btn)btn.classList.add('ok');Snd.right();cheer(GOOD[rnd(GOOD.length)])}
  else{f.w++;t.w++;G.wrong++;G.streak=0;if(btn)btn.classList.add('bad');Snd.wrong();cheer(BAD[rnd(BAD.length)]);
    $$('#answers button').forEach(function(b){if(+b.getAttribute('data-v')===q.a*q.b)b.classList.add('ok');else if(b!==btn)b.classList.add('dim')})}
  if(G.best>(p.bestStreak||0))p.bestStreak=G.best;
  save();updateScore();
  G.nt=setTimeout(function(){G.nt=null;if(G&&!G.over)nextQ()},ok?750:1300);
}
function finish(){
  if(!G||G.over)return;
  G.over=true;endTimers();
  var p=cur(),total=G.correct+G.wrong;
  var s={type:G.mode,scope:G.scope,n:G.n,secs:G.mode==='contest'?G.secs:0,date:Date.now(),
         correct:G.correct,total:total,dur:Math.round((Date.now()-G.t0)/1000),score:G.mode==='contest'?G.correct*10:0,best:G.best};
  p.sessions.push(s);if(p.sessions.length>300)p.sessions.shift();
  if(G.mode==='learn'){
    var L=p.learn[G.n]||(p.learn[G.n]={sessions:0,best:0});
    L.sessions++;if(G.correct>L.best)L.best=G.correct;
  }
  save();onPush(p);showResult(s);
}

    e.style.left=rnd(96)+'vw';e.style.animationDuration=(2+Math.random()*2.2)+'s';e.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(e);setTimeout(function(){e.remove()},5200);

/* ---------- analysis ---------- */
function pctOf(o){var t=o.c+o.w;return t?Math.round(o.c/t*100):0}
function openAnalysis(){
  var p=cur();if(!p)return;
  var S=p.sessions,learnS=S.filter(function(s){return s.type==='learn'}).length,
      prS=S.filter(function(s){return s.type==='practice'}).length,
      coS=S.filter(function(s){return s.type==='contest'}).length,
      chS=S.filter(function(s){return s.type==='champ'}).length;
  var C=0,W=0,keys=Object.keys(p.facts);
  keys.forEach(function(k){C+=p.facts[k].c;W+=p.facts[k].w});
  var tot=C+W,acc=tot?Math.round(C/tot*100):0;
  var learned=[];for(var n=2;n<=9;n++){if(p.learn[n]&&p.learn[n].best>=8)learned.push(n)}
  var secs=S.reduce(function(a,s){return a+s.dur},0);
  var h='<div class="sec" style="text-align:center"><div style="font-size:46px">'+p.avatar+'</div><div style="font-size:24px">'+esc(p.name)+'</div><div style="font-size:16px;opacity:.75">'+p.age+' yosh · hisobot ota-onalar uchun</div></div>';
  h+='<div class="stat3"><div class="stat"><b>'+tot+'</b><span>jami javob</span></div><div class="stat"><b>'+acc+'%</b><span>to\'g\'ri</span></div><div class="stat"><b>'+Math.round(secs/60)+'</b><span>daqiqa o\'ynadi</span></div></div>';
  h+='<div class="stat4"><div class="stat"><b>'+learnS+'</b><span>o\'rganish</span></div><div class="stat"><b>'+prS+'</b><span>mashq</span></div><div class="stat"><b>'+coS+'</b><span>musobaqa</span></div><div class="stat"><b>'+chS+'</b><span>chempionat</span></div></div>';
  if(!tot){
    h+='<div class="sec tip"><h3>👋 Hali o\'ynalmagan</h3><ul><li>Boshlash uchun «O\'rganamiz» bo\'limiga kiring.</li><li>Natijalar shu yerda paydo bo\'ladi.</li></ul></div>';
    $('#anBody').innerHTML=h;go('analysis');return;
  }
  /* per-table bars */
  h+='<div class="sec"><h3>Jadvallar bo\'yicha natija</h3>';
  for(var t=2;t<=9;t++){
    var o=p.tables[t],pc=o?pctOf(o):0,col=!o?'#d6dcf0':pc>=85?'#2fb468':pc>=65?'#ffb347':'#f25555';
    h+='<div class="tb"><span class="l">'+t+' × </span><div class="bar"><i style="width:'+(o?pc:0)+'%;background:'+col+'"></i></div><span class="p">'+(o?pc+'% ('+(o.c+o.w)+')':'—')+'</span></div>';
  }
  h+='</div>';
  /* strengths */
  var good=[],bad=[],tips=[];
  if(learned.length)good.push('To\'liq o\'rgangan jadvallar: <b>'+learned.join(', ')+'</b>');
  var strongT=[],weakT=[];
  for(var t2=2;t2<=9;t2++){var o2=p.tables[t2];if(o2&&o2.c+o2.w>=5){if(pctOf(o2)>=85)strongT.push(t2);else if(pctOf(o2)<70)weakT.push(t2)}}
  if(strongT.length)good.push('Yaxshi biladigan jadvallari: <b>'+strongT.join(', ')+'</b>');
  if((p.bestStreak||0)>=3)good.push('Eng uzun ketma-ket to\'g\'ri javob: <b>'+p.bestStreak+'</b> ta');
  var bestC=0;S.forEach(function(s){if(s.type==='contest'&&s.score>bestC)bestC=s.score});
  if(bestC)good.push('Musobaqadagi eng yaxshi natija: <b>'+bestC+'</b> ball');
  if(acc>=85)good.push('Umumiy aniqlik yuqori: <b>'+acc+'%</b>');
  if(p.champ&&p.champ.medal)good.push('Chempionat kubogi: <b>'+({gold:'🥇 oltin',silver:'🥈 kumush',bronze:'🥉 bronza'})[p.champ.medal]+'</b>');
  if(!good.length)good.push('Hali yutuqlar yig\'ilmoqda — mashq qilishda davom eting!');
  if(weakT.length)bad.push('Qiyin jadvallar: <b>'+weakT.join(', ')+'</b>');
  var wk=keys.filter(function(k){return p.facts[k].w>0}).sort(function(a,b){
    var fa=p.facts[a],fb=p.facts[b];return (fb.w-fb.c*.5)-(fa.w-fa.c*.5)}).slice(0,5);
  if(wk.length)bad.push('Ko\'p xato qilinadigan misollar: '+wk.map(function(k){var f=p.facts[k];return '<b>'+k.replace('x',' × ')+'</b> ('+f.w+' xato)'}).join(', '));
  if(acc<60)bad.push('Umumiy aniqlik past: <b>'+acc+'%</b>');
  var unl=[];for(var u=2;u<=9;u++){if(!(p.learn[u]&&p.learn[u].best>=8))unl.push(u)}
  if(unl.length&&unl.length<8)bad.push('Hali o\'rganilmagan jadvallar: '+unl.join(', '));
  if(!bad.length)bad.push('Katta kamchiliklar yo\'q. Ajoyib!');
  if(weakT.length)tips.push('«O\'rganamiz» bo\'limida <b>'+weakT.join(', ')+'</b> jadvallarini qayta takrorlang.');
  if(wk.length)tips.push('Qiyin misollarni kuniga 5 daqiqa mashq qiling — ilova ularni tez-tez so\'raydi.');
  if(coS===0&&prS>0)tips.push('Mashqdan keyin «Musobaqa»da tezlikni sinab ko\'ring.');
  if(!tips.length)tips.push('Har kuni 10 daqiqa mashq — eng yaxshi natija beradi.');
  h+='<div class="sec good"><h3>🏅 Yutuqlar</h3><ul>'+good.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  h+='<div class="sec bad"><h3>🔎 Kamchiliklar</h3><ul>'+bad.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  h+='<div class="sec tip"><h3>💡 Tavsiya</h3><ul>'+tips.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>';
  /* history */
  var names={learn:'📚 O\'rganish',practice:'✏️ Mashq',contest:'🏆 Musobaqa',champ:'🏅 Chempionat'};
  var hist=S.slice(-8).reverse().map(function(s){
    return '<div><span>'+names[s.type]+' · '+(s.type==='champ'?s.n+'-bosqich':s.n+(s.type==='learn'?'':(s.scope==='all'?' gacha':' alohida')))+'</span><span>'+s.correct+'/'+s.total+((s.type==='contest'||s.type==='champ')?' · '+s.score+' ball':'')+'</span></div><div style="background:none;padding:0 10px 4px;font-size:12px;opacity:.65;margin-top:-4px"><span>'+fmtDate(s.date)+'</span><span></span></div>';
  }).join('');
  h+='<div class="sec"><h3>🕒 So\'nggi o\'yinlar</h3><div class="hist">'+hist+'</div></div>';
  $('#anBody').innerHTML=h;
  go('analysis');
}

function boardData(){
  return DB.profiles.map(function(p){
    var pts=0,best=0,cnt=0;
    p.sessions.forEach(function(s){if(s.type==='contest'||s.type==='champ'){pts+=s.score;cnt++;if(s.score>best)best=s.score}});
    return {p:p,pts:pts,best:best,cnt:cnt};
  }).filter(function(x){return x.cnt>0}).sort(function(a,b){return b.pts-a.pts||b.best-a.best});
}

/* ---------- onlayn: Firebase Realtime Database + anonim kirish (REST) ---------- */
function onURL(){return String(window.KARRA_DB_URL||'').replace(/\/+$/,'')}
function onLocalDev(){return /^http:\/\/(localhost|127\.0\.0\.1)[:\/]/.test(onURL())}
function onReady(){
  var u=onURL();
  if(onLocalDev())return true;                       /* faqat sinov uchun */
  return /^https:\/\/[^\s]+$/.test(u)&&String(window.KARRA_API_KEY||'').length>10;
}
var AUTH_BASE=window.KARRA_AUTH_BASE||'https://identitytoolkit.googleapis.com';
var TOKEN_BASE=window.KARRA_TOKEN_BASE||'https://securetoken.googleapis.com';
var Auth={uid:null,idToken:null,exp:0,refresh:null,pending:null};
try{var _a=JSON.parse(localStorage.getItem('karra_auth'));if(_a&&_a.refresh){Auth.refresh=_a.refresh;Auth.uid=_a.uid}}catch(e){}
function authSave(){try{localStorage.setItem('karra_auth',JSON.stringify({refresh:Auth.refresh,uid:Auth.uid}))}catch(e){}}
function timedFetch(url,opt){
  var c=(typeof AbortController!=='undefined')?new AbortController():null,t=null;
  opt=opt||{};
  if(c){opt.signal=c.signal;t=setTimeout(function(){c.abort()},9000)}
  return fetch(url,opt).then(function(r){if(t)clearTimeout(t);return r},function(e){if(t)clearTimeout(t);throw e});
}
function authToken(force){
  if(onLocalDev()&&!window.KARRA_API_KEY)return Promise.resolve(null);
  if(!force&&Auth.idToken&&Date.now()<Auth.exp-60000)return Promise.resolve(Auth.idToken);
  if(Auth.pending)return Auth.pending;
  var key=encodeURIComponent(window.KARRA_API_KEY||''),p;
  function take(r,j){
    if(!r.ok)throw new Error('auth '+r.status);
    Auth.idToken=j.idToken||j.id_token;Auth.refresh=j.refreshToken||j.refresh_token;Auth.uid=j.localId||j.user_id;
    Auth.exp=Date.now()+(parseInt(j.expiresIn||j.expires_in,10)||3600)*1000;authSave();return Auth.idToken;
  }
  if(Auth.refresh){
    p=timedFetch(TOKEN_BASE+'/v1/token?key='+key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(Auth.refresh)})
      .then(function(r){return r.json().then(function(j){return take(r,j)})})
      .catch(function(){Auth.refresh=null;Auth.idToken=null;return signUp()});
  }else p=signUp();
  function signUp(){
    return timedFetch(AUTH_BASE+'/v1/accounts:signUp?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})})
      .then(function(r){return r.json().then(function(j){return take(r,j)})});
  }
  Auth.pending=p;
  p.then(function(){Auth.pending=null},function(){Auth.pending=null});
  return p;
}
function onFetch(path,opt,retried){
  opt=opt||{};
  return authToken(!!retried).then(function(tok){
    var url=onURL()+path+(tok?(path.indexOf('?')>=0?'&':'?')+'auth='+encodeURIComponent(tok):'');
    return timedFetch(url,{method:opt.method||'GET',headers:opt.headers,body:opt.body}).then(function(r){
      if(r.status===401&&!retried&&tok)return onFetch(path,opt,true);
      if(!r.ok)throw new Error('http '+r.status);
      return r.json();
    });
  });
}
function myRecord(p){
  var pts=0,games=0,C=0,W=0,stage=0;
  p.sessions.forEach(function(s){if(s.type==='contest'||s.type==='champ'){pts+=s.score;games++}});
  Object.keys(p.facts).forEach(function(k){C+=p.facts[k].c;W+=p.facts[k].w});
  var c=p.champ;
  if(c)STAGES.forEach(function(s){if(c.st[s.id]&&c.st[s.id].passed&&s.id>stage)stage=s.id});
  /* faqat ism, rasm va ballar yuboriladi: yosh, familiya, joylashuv yuborilmaydi */
  var r={name:String(p.name).slice(0,16),av:String(p.avatar).slice(0,8),pts:pts,games:games,acc:(C+W)?Math.round(C/(C+W)*100):0,stage:stage,lastSeen:{'.sv':'timestamp'}};
  if(c&&c.medal)r.medal=c.medal;
  return r;
}

function ensureOnId(p){
  if(!Auth.uid)return false;
  if(!p.online)p.online={on:true,id:''};
  if(!p.online.id||p.online.id.indexOf(Auth.uid)!==0){

    p.online.id=Auth.uid+'_'+s;save();
  }
  return true;
}
function onPushRaw(p){
  if(!onReady()||!p||!p.online||!p.online.on)return Promise.resolve(null);
  return authToken().then(function(){
    if(!ensureOnId(p))throw new Error('auth');
    return onFetch('/players/'+p.online.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(myRecord(p))});
  });
}

function startChamp(id){
  endTimers();

  CG={S:S,q:0,correct:0,wrong:0,streak:0,best:0,score:0,input:'',cur:null,locked:true,deadline:0,timer:null,nt:null,over:false,used:{},t0:Date.now()};

function cPick(){
  var p=cur(),S=CG.S,pool=[];
  for(var a=2;a<=S.max;a++)for(var b=2;b<=S.max;b++){
    if(CG.used[a+'x'+b])continue;
    var w=weightFor(p,a,b);for(var i=0;i<w;i++)pool.push([a,b]);
  }
  if(!pool.length){CG.used={};return cPick()}
  return pool[rnd(pool.length)];
}
function cShow(){
  var el=$('#cAns');

}
function cNext(){
  if(!CG||CG.over)return;
  if(CG.q>=CG.S.q){cFinish();return}
  var c=cPick();CG.used[c[0]+'x'+c[1]]=1;CG.cur={a:c[0],b:c[1]};
  CG.input='';CG.locked=false;
  $('#cBox').innerHTML=c[0]+' × '+c[1]+' = ?';
  $('#cInfo').textContent=CG.S.id+'-bosqich · Savol '+(CG.q+1)+' / '+CG.S.q;

function cAnswer(val){
  if(!CG||CG.locked||CG.over)return;
  CG.locked=true;if(CG.timer){clearInterval(CG.timer);CG.timer=null}
  var p=cur(),q=CG.cur,right=q.a*q.b,ok=(val===right);
  var key=Math.min(q.a,q.b)+'x'+Math.max(q.a,q.b);
  var f=p.facts[key]||(p.facts[key]={c:0,w:0}),t=p.tables[q.a]||(p.tables[q.a]={c:0,w:0});
  CG.q++;
  var el=$('#cAns');

    var left=Math.max(0,Math.ceil((CG.deadline-Date.now())/1000));
    CG.score+=10+Math.min(5,left);CG.correct++;CG.streak++;if(CG.streak>CG.best)CG.best=CG.streak;
    f.c++;t.c++;el.className='ansBox ok';el.textContent=right;Snd.right();cheer(GOOD[rnd(GOOD.length)]);
  }else{
    CG.wrong++;CG.streak=0;f.w++;t.w++;
    el.className='ansBox bad';el.textContent=(val===null?'⏱ ':'')+'= '+right;Snd.wrong();cheer(BAD[rnd(BAD.length)]);
  }
  if(CG.best>(p.bestStreak||0))p.bestStreak=CG.best;
  save();$('#cScore').textContent='⭐ '+CG.score;

function cFinish(){
  if(!CG||CG.over)return;
  CG.over=true;endTimers();
  var p=cur(),c=chp(p),S=CG.S;

  var pct=CG.correct/S.q,stars=pass?(pct>=1?3:pct>=.85?2:1):0;
  c.played++;

  if(pass)r.passed=true;

  if(stars>r.stars)r.stars=stars;
  var medal='';
  if(S.id===STAGES.length&&pass){
    var tot=0;STAGES.forEach(function(s){var x=c.st[s.id];if(x)tot+=x.best});
    var mx=0;STAGES.forEach(function(s){mx+=s.q*15});var m=tot>=mx*.8?'gold':tot>=mx*.6?'silver':'bronze';

    medal=m;
  }
  p.sessions.push({type:'champ',scope:'all',n:S.id,secs:0,date:Date.now(),correct:CG.correct,total:S.q,dur:Math.round((Date.now()-CG.t0)/1000),score:CG.score,best:CG.best});
  if(p.sessions.length>300)p.sessions.shift();

  else h+='<h2>'+(pass?'Bosqichdan o\'tdingiz! ✅':'Deyarli bo\'ldi! 💪')+'</h2>';
  h+='<div class="big">'+CG.correct+' / '+S.q+'</div><p>'+CG.score+' ball · eng uzun ketma-ket: '+CG.best+' 🔥</p>';
  if(!pass)h+='<p>Keyingi bosqichga o\'tish uchun kamida '+need+' ta to\'g\'ri javob kerak. Yana bir bor urinib ko\'ring!</p>';
  if(pass&&S.id<STAGES.length)h+='<p>'+(S.id+1)+'-bosqich ochildi! 🔓</p>';
  var nextId=pass&&S.id<STAGES.length?S.id+1:S.id;

     '<button class="bigbtn purple" id="rSel">🏅 Chempionat</button><button class="bigbtn orange" id="rHome">🏠 Bosh sahifa</button>';

})();

/* ---------- dam olish (ko'zlar uchun) ---------- */
var REST={LIMIT:20*60*1000,WARN:18*60*1000,BREAK:10*60*1000,GRACE:3*60*1000};
var TIPS=['👀 Uzoqqa, derazadan tashqariga qara','😌 Ko\'zlaringni sekin yum va och','💧 Bir stakan suv ich','🤸 Cho\'zilib, qo\'l-oyoqlaringni yozib ol','🌳 Eng uzoqdagi narsaga 20 soniya qara'];
function lockEl(){return $('#lock')}
function lockOn(){return lockEl().classList.contains('on')}
var restSave=0;
function startLock(){
  var R=DB.rest;
  endTimers();
  if(G&&!G.over)G.over=true;
  if(CG&&!CG.over)CG.over=true;
  if(scr==='game'||scr==='cgame')go('home');
  R.lockUntil=Date.now()+REST.BREAK;R.play=0;R.warned=false;R.last=0;save();
  Snd.stopMusic();
  restTick();
}
function showLock(ms){
  var el=lockEl();el.classList.add('on');
  var s=Math.ceil(ms/1000),m=Math.floor(s/60);
  $('#lkIcon').textContent='😴';
  $('#lkTitle').textContent='Dam olish vaqti!';
  $('#lkTime').textContent=pad2(m)+':'+pad2(s%60);
  $('#lkTip').textContent=TIPS[Math.floor(s/30)%TIPS.length];
  $('#lkBtn').style.display='none';
}
function showRestDone(){
  var el=lockEl();el.classList.add('on');
  $('#lkIcon').textContent='🌞';
  $('#lkTitle').textContent='Dam oldingiz! Davom etamizmi?';
  $('#lkTime').textContent='🎉';
  $('#lkTip').textContent='Ko\'zlaringiz dam oldi. Yangi o\'yinlar sizni kutmoqda!';
  var b=$('#lkBtn');b.style.display='block';
  b.onclick=function(){
    var R=DB.rest;R.lockUntil=0;R.play=0;R.last=Date.now();R.warned=false;save();
    el.classList.remove('on');updateMusic();
  };
}
function restTick(){
  var R=DB.rest,now=Date.now();
  if(R.lockUntil){
    if(now<R.lockUntil)showLock(R.lockUntil-now);else showRestDone();
    return;
  }
  if(document.hidden)return;
  var dt=1000;
  if(R.last){
    var gap=now-R.last;
    if(gap>=REST.BREAK){R.play=0;R.warned=false}   /* uzoq vaqt o'ynamagan — dam olgan */
    else if(gap<3000)dt=gap;
  }
  R.play+=dt;R.last=now;
  if(++restSave>=5){restSave=0;save()}
  if(!R.warned&&R.play>=REST.WARN&&R.play<REST.LIMIT){R.warned=true;save();toast('⏰ Tez orada dam olamiz 😴')}
  if(R.play>=REST.LIMIT){
    var inGame=(scr==='game'||scr==='cgame');
    if(!inGame||R.play>=REST.LIMIT+REST.GRACE)startLock();
  }
}


/* ---------- Android back button ---------- */
document.addEventListener('deviceready',function(){});
try{
  var CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp&&CapApp.addListener){
    CapApp.addListener('backButton',function(){
      if(lockOn())return;
      if(modalOpen()){if(!modalRequired)closeModal();return}
      if(!goBack())CapApp.exitApp();
    });
  }
}catch(e){}

/* ---------- boot ---------- */
refreshHome();
if(!cur()){
  if(DB.profiles.length){DB.current=DB.profiles[0].id;save();refreshHome()}
  else openNew(true);
}
setInterval(restTick,1000);restTick();
window.__karra={DB:function(){return DB},go:go,REST:REST,restTick:restTick,TRACKS:TRACKS,Snd:Snd,Auth:Auth,onFetch:onFetch};
})();
</script>
